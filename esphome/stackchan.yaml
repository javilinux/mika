substitutions:
  name: m5stack-stackchan
  friendly_name: Mika StackChan (Home Assistant)

packages:
  m5stack.stackchan-factory: github://m5stack/esphome-yaml/examples/kit/stackchan-bsp.factory.yaml@main

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Mika-ESPHome-Fallback"
